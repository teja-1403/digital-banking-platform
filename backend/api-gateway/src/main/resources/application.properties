# ============================================================
# Resilience4j Circuit Breaker Configuration
# ============================================================

resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

# Downstream response timeout
resilience4j.timelimiter.instances.authServiceCircuitBreaker.timeoutDuration=5s
resilience4j.timelimiter.instances.accountServiceCircuitBreaker.timeoutDuration=5s
resilience4j.timelimiter.instances.transactionServiceCircuitBreaker.timeoutDuration=5s

# ============================================================
# Actuator / Observability
# ============================================================

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always