spring.application.name=api-gateway
server.port=8080

services.auth.url=${AUTH_SERVICE_URL}
services.account.url=${ACCOUNT_SERVICE_URL}
services.transaction.url=${TRANSACTION_SERVICE_URL}

cors.allowed-origin=${CORS_ALLOWED_ORIGINS}




